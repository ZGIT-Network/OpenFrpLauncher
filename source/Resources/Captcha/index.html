<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenFrp Launcher - Captcha Ap</title>
    <link rel="stylesheet" href=".\index.css">
</head>

<body>
    <div class="root">
        <main class="dialog">
            <div id="captcha-box">

            </div>
            <div class="dialog-control">
                <button onclick="reloadPage()">刷新</button>
                <button onclick="chrome.webview.postMessage('closeDialog')">关闭</button>
            </div>
        </main>
    </div>
    <script>
        // webview2 configuration
        if ('webview' in window.chrome) {
            window.chrome.webview.addEventListener('message', arg => {
                console.log(arg.data);
                switch (arg.data) {
                    case "DisplayCaptchaWebView": {
                        const doc = document.querySelector("main.dialog");
                        if (doc === null) return;

                        const span = [
                            // { opacity: 0 },
                            { opacity: 1 }
                        ]
                        const timing = {
                            duration: 220,
                            iterations: 1,
                            fill: "forwards",
                            easing: "ease-out"
                        }
                        doc.animate(span, timing);
                        break;
                    }
                    case "HiddenCaptchaWebView": {
                        const doc = document.querySelector("main.dialog");
                        if (doc === null) return;

                        const span = [
                            // { opacity: 1 },
                            { opacity: 0 }
                        ]
                        const timing = {
                            duration: 250,
                            iterations: 1,
                            fill: "forwards",
                            easing: "ease-out"
                        }
                        doc.animate(span, timing);
                        break;
                    }
                    case "Dark":
                    case "Light": {
                        toggleUserColorScheme(arg.data.toLowerCase());
                    }
                    case "refreshCaptcha":{
                        vCaptcha.reloadCaptcha();
                    }
                }
                if (arg.data.startsWith("accent^")) {
                    setUserAccentColor(arg.data.substring(7));
                }
            });
        }
        
        function setUserAccentColor(hexColor) {
            const root = document.querySelector("div.root");
            if (root === null) {
                return;
            }
            root.style.setProperty("--accentColor",hexColor);
        }
        function toggleUserColorScheme(scheme) {
            const root = document.querySelector("div.root");
            if (root === null || !(scheme === "dark" || scheme === "light")) {
                return;
            }
            const rev = scheme === "dark" ? "light" : "dark";
            root.classList.remove(rev);
            if (!root.classList.contains(scheme)) {
                root.classList.add(scheme);
            }
        }
        function reloadPage(){
            vCaptcha.reloadCaptcha();
            // 为了防止主题色丢失，这里调用到后端 C#
            //chrome.webview.postMessage("reloadPage");
        }
        let vCaptcha;
        const app = {
            requestCaptchaDataUrl: 'https://captcha.17a.ink/gen',
            validCaptchaUrl: 'https://captcha.17a.ink/check',
            bindEl: '#captcha-box',
            chainString: 'cl>json>rsaaes>base64',
            customParentClass: 'tianai-custom-parent',

            validSuccess: (result, c, t) => {
                // 销毁
                //chrome.webview.hostObjects.dialog.CodeFallback(result.data.token)
                console.log("Captcha Pass: " + result.data.token);
                chrome.webview.postMessage(result.data.token);
            },
        };
        var vid = setInterval(function () {
            if (window["TAC"] !== undefined) {
                clearInterval(vid);
                vCaptcha = new window.TAC(app);
                console.warn(vCaptcha.init());
                console.log(vCaptcha);
            }
        }, 250);
    </script>
    <script src="./tianai/jsencrypt.min.js"></script>
    <script src="./tianai/crypto-js.min.js"></script>
    <script src="./tianai/tac.min.js"></script>
    <script src="./tianai/enc.js"></script>
    <link rel="stylesheet" href="./tianai/styles/tac-custom.css">
    <link rel="stylesheet" href="./tianai/styles/tac.css">
</body>

</html>
