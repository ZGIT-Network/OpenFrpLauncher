<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenFrp 快捷登录</title>
    <style>
        html {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color-scheme: dark light;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        .lt {
            font-size: 2.5rem;
        }

        .bt {
            font-size: 2rem;
            opacity: .7;
        }

        .lro {
            margin: 10vh 8vw;
            display: flex;
            flex-direction: column;
        }

        img{
            display: none;
        }
    </style>
</head>

<body>
    <div class="lro">
        <span class="lt">您现在可以关闭浏览器了。</span>
        <span class="bt">若启动器登录失败，请尝试重新登录。</span>
        <img src="./close"/>
    </div>
</body>
</html>
